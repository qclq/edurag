services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edurag}
      POSTGRES_USER: ${POSTGRES_USER:-edurag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edurag}
    volumes:
      - edurag-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    volumes:
      - edurag-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - edurag-milvus-etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - edurag-milvus-minio:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.6.22
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - edurag-milvus:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-edurag}:${POSTGRES_PASSWORD:-edurag}@postgres:5432/${POSTGRES_DB:-edurag}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-development-secret-change-before-production-2026}
      FRONTEND_URL: http://localhost:${WEB_PORT:-8080}
      ALLOWED_ORIGINS: '["http://localhost:${WEB_PORT:-8080}","http://127.0.0.1:${WEB_PORT:-8080}"]'
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SSO_PROVIDER: ${SSO_PROVIDER:-disabled}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/data/files
      LIBREOFFICE_BINARY: ${LIBREOFFICE_BINARY:-soffice}
      OFFICE_CONVERSION_TIMEOUT_SECONDS: ${OFFICE_CONVERSION_TIMEOUT_SECONDS:-120}
      TASK_DISPATCH_MODE: celery
      MILVUS_ENABLED: "true"
      MILVUS_URI: http://milvus:19530
      MILVUS_DATABASE: default
      MILVUS_COLLECTION_PREFIX: edurag_chunks
      MILVUS_COLLECTION_ALIAS: edurag_chunks_current
      EMBEDDING_PROVIDER: qwen
      QWEN_EMBEDDING_BASE_URL: ${QWEN_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: "1024"
      QWEN_OCR_BASE_URL: ${QWEN_OCR_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_OCR_MODEL: ${QWEN_OCR_MODEL:-qwen-vl-ocr}
      LLM_PROVIDER: deepseek
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-disabled}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - edurag-files:/app/data/files
    expose:
      - "8000"
    command:
      - sh
      - -c
      - alembic upgrade head && exec fastapi run app/main.py --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-edurag}:${POSTGRES_PASSWORD:-edurag}@postgres:5432/${POSTGRES_DB:-edurag}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-development-secret-change-before-production-2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/data/files
      LIBREOFFICE_BINARY: ${LIBREOFFICE_BINARY:-soffice}
      OFFICE_CONVERSION_TIMEOUT_SECONDS: ${OFFICE_CONVERSION_TIMEOUT_SECONDS:-120}
      TASK_DISPATCH_MODE: celery
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-3}
      CELERY_MAX_TASKS_PER_CHILD: ${CELERY_MAX_TASKS_PER_CHILD:-20}
      MILVUS_ENABLED: "true"
      MILVUS_URI: http://milvus:19530
      MILVUS_DATABASE: default
      MILVUS_COLLECTION_PREFIX: edurag_chunks
      MILVUS_COLLECTION_ALIAS: edurag_chunks_current
      EMBEDDING_PROVIDER: qwen
      QWEN_EMBEDDING_BASE_URL: ${QWEN_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: "1024"
      QWEN_OCR_BASE_URL: ${QWEN_OCR_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_OCR_MODEL: ${QWEN_OCR_MODEL:-qwen-vl-ocr}
      LLM_PROVIDER: deepseek
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-disabled}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - edurag-files:/app/data/files
    command: ["python", "-m", "app.scripts.run_worker"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 20s

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-edurag}:${POSTGRES_PASSWORD:-edurag}@postgres:5432/${POSTGRES_DB:-edurag}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-development-secret-change-before-production-2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TASK_DISPATCH_MODE: celery
      MILVUS_ENABLED: "true"
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ADMIN_RECORD_RETENTION_HOURS: "72"
    depends_on:
      backend:
        condition: service_healthy
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  edurag-postgres:
  edurag-redis:
  edurag-files:
  edurag-milvus-etcd:
  edurag-milvus-minio:
  edurag-milvus:
