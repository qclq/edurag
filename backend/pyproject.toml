[project]
name = "edurag-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "argon2-cffi>=25.1.0",
    "boto3>=1.40.0",
    "celery[redis]>=5.5.3",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.142.4",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pg8000>=1.31.5",
    "pymupdf>=1.26.0",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.44",
]

[project.optional-dependencies]
milvus = ["pymilvus>=2.6.0,<2.7"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
